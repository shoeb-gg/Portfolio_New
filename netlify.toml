[build]
  command = "npm run build"
  publish = "dist/my-portfolio/browser"

# Hashed build output (main-*.js, chunk-*.js, polyfills-*.js, styles-*.css, media/*): the name
# changes whenever the content does, so browsers can keep these for a year. index.html keeps
# Netlify's default `must-revalidate`, so deploys still take effect immediately.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted fonts never change in place.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unhashed assets (Lottie JSON, images, resume): cache a day, serve stale for a week while refreshing.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
